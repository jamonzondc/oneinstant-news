# Temporary (iter 6): probes headlines and regional candidates from GitHub's network. Removed before merge.
name: Probe
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node probe/probe.ts
