# Builds the data (real feeds) and the web app, then deploys to Firebase Hosting and the Cloudflare Pages
# mirror (ADR 0003, 0005). Each deploy step only runs when its secrets exist, so forks and a fresh repo stay green.
# On pull requests it only builds: that verifies the catalogue URLs from GitHub's network (report in the job summary).
name: Deploy

on:
  schedule:
    - cron: '*/15 * * * *' # data refresh, Firebase only
    - cron: '5 */2 * * *' # data refresh + Cloudflare mirror (keeps it under the free plan's monthly deploys)
    - cron: '17 4 * * 1' # keepalive: GitHub disables crons after 60 days without activity
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-pr-{0}', github.ref) || 'deploy' }}
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'oneinstant-news' }}
  HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && vars.FIREBASE_PROJECT_ID != '' }}
  HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
  FIREBASE_TOOLS: firebase-tools@15.36.0
  WRANGLER: wrangler@4.162.0

jobs:
  deploy:
    if: github.event.schedule != '17 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build data
        id: data
        env:
          PREVIOUS_URL_OVERRIDE: ${{ vars.PREVIOUS_URL }}
        run: |
          urls="$PREVIOUS_URL_OVERRIDE"
          if [ -z "$urls" ]; then
            [ -n "$FIREBASE_PROJECT_ID" ] && urls="https://$FIREBASE_PROJECT_ID.web.app/news.json"
            [ "$HAS_CLOUDFLARE" = true ] && urls="${urls:+$urls,}https://$CF_PROJECT.pages.dev/news.json"
          fi
          PREVIOUS_URL="$urls" npm run build:data

      - name: Build web
        id: web
        run: npm run build:web

      - name: Deploy to Firebase Hosting
        id: firebase
        if: env.HAS_FIREBASE == 'true' && github.event_name != 'pull_request'
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes "$FIREBASE_TOOLS" deploy --only hosting \
            --project "$FIREBASE_PROJECT_ID" --non-interactive --message "run ${{ github.run_id }}"
          rm -f "$RUNNER_TEMP/sa.json"
          curl -fsS --max-time 20 -o /dev/null "https://$FIREBASE_PROJECT_ID.web.app/news.json"

      # A failing Firebase deploy (e.g. daily quota exceeded) must not stop the mirror.
      - name: Deploy to Cloudflare Pages
        if: >-
          !cancelled() && steps.web.outcome == 'success' && env.HAS_CLOUDFLARE == 'true' && github.event_name != 'pull_request' &&
          (github.event_name != 'schedule' || github.event.schedule == '5 */2 * * *' || vars.CLOUDFLARE_EVERY_RUN == 'true')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes "$WRANGLER" pages deploy dist --project-name "$CF_PROJECT" --branch main --commit-dirty=true
          curl -fsS --max-time 20 -o /dev/null "https://$CF_PROJECT.pages.dev/news.json"

      - name: Missing secrets
        if: github.event_name != 'pull_request' && (env.HAS_FIREBASE != 'true' || env.HAS_CLOUDFLARE != 'true')
        run: echo "::notice::Firebase configured=$HAS_FIREBASE, Cloudflare configured=$HAS_CLOUDFLARE. See docs/DEPLOY.md."

  keepalive:
    if: github.event.schedule == '17 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
